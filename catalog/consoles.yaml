# Limited-edition consoles (spec 5.1); every entry was checked to be a real release.

# PlayStation 30th Anniversary Collection, Sony, Nov 2024
- id: ps5-30th-anniversary
  category: console
  name: PlayStation 5 Digital Edition 30th Anniversary Bundle
  ebay_query: "ps5 30th anniversary"
  match: '\b(ps5|playstation ?5)\b(?! pro\b)(?!.*\bportal\b)(?=.*\b(consoles?|bundle|systems?|digital edition)\b|(?!.*\b(dualsense|controllers?|joy ?cons?)\b)).*\b30th anniversary\b'
  exclude: ['\bcovers?\b', '\b(face ?)?plates?\b', '\bwraps?\b', '\bdecals?\b', '\bcarrying case\b', '(?<!with )(?<!and )\bcases?\b', '(?<!with )(?<!and )\bdocks?\b', '(?<!with )(?<!and )\bstands?\b', '\bsteel ?books?\b', '(?<!with )(?<!and )(?<!\+ )\bgames?\b']
  max_price: null

