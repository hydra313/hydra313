# Single-item GPUs (spec 5.1): NVIDIA RTX only. Patterns run on normalize()d
# titles.

- id: rtx-3050
  category: gpu
  name: GeForce RTX 3050
  ebay_query: "rtx 3050"
  match: '\b(rtx )?3050\b(?! (ti|super)\b)'
  exclude: ['\b6 ?gb?\b']
  max_price: null

- id: rtx-3060-8gb
  category: gpu
  name: GeForce RTX 3060 8GB
  ebay_query: "rtx 3060 8gb"
  match: '\b(rtx )?3060\b(?! (ti|super)\b).*\b8 ?gb?\b|\b8 ?gb?\b.*\b(rtx )?3060\b(?! (ti|super)\b)'
  exclude: []
