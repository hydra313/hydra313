# Single-item GPUs (spec 5.1). Patterns run on normalize()d titles.

- id: rtx-3050
  category: gpu
  name: GeForce RTX 3050
  ebay_query: "rtx 3050"
  match: '\b(rtx )?3050\b(?! (ti|super)\b)'
  exclude: []
  max_price: null

