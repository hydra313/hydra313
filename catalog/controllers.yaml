# Limited-edition controllers (spec 5.1); every entry was checked to be a real release.

# PlayStation 30th Anniversary Collection, Sony, Nov 2024
- id: dualsense-30th-anniversary
  category: controller
  name: DualSense 30th Anniversary
  ebay_query: "dualsense 30th anniversary"
  match: '\bdualsense\b(?! edge\b).*\b30th anniversary\b|^(?!.*\b(consoles?|bundle|systems?|digital edition)\b).*\b30th anniversary\b.*\bdualsense\b(?! edge\b)'
  exclude: []
  max_price: null

# PlayStation 30th Anniversary Collection, Sony, Nov 2024
- id: dualsense-edge-30th-anniversary
  category: controller
  name: DualSense Edge 30th Anniversary
  ebay_query: "dualsense edge 30th anniversary"
  match: '\bdualsense edge\b.*\b30th anniversary\b|^(?!.*\b(consoles?|bundle|systems?|digital edition)\b).*\b30th anniversary\b.*\bdualsense edge\b'
