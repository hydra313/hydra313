- id: gameboy-advance
  name: Game Boy Advance
  match: '\b(nintendo )?game ?boy advance( sp)?\b|\bgba( sp)?\b'
  ebay_lot_query: "game boy advance game lot"

- id: ds
  name: Nintendo DS
  match: '\b(nintendo )?(ds|dsi)( lite| xl| ll)?\b'
  ebay_lot_query: "nintendo ds game lot"

- id: 3ds
  name: Nintendo 3DS
  match: '\b(nintendo )?(new )?(nintendo )?[23]ds( xl| ll)?\b'
  ebay_lot_query: "3ds game lot"

- id: genesis
  name: Sega Genesis
  match: '\b(sega )?(genesis|mega drive)\b'
