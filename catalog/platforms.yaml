# Game platforms (spec 5.3). Look-alikes nest by match span ("xbox" inside
# "xbox 360"), so the most specific platform wins.

- id: nes
  name: Nintendo Entertainment System
  match: '\b(nes|nintendo entertainment system|famicom)\b'
  ebay_lot_query: "nes game lot"

- id: snes
  name: Super Nintendo
  match: '\b(snes|super nintendo( entertainment system)?|super famicom)\b'
  ebay_lot_query: "snes game lot"

- id: n64
  name: Nintendo 64
  match: '\b(n64|nintendo 64)\b'
  ebay_lot_query: "n64 game lot"

- id: gamecube
  name: Nintendo GameCube
  match: '\b(nintendo )?game ?cube\b|\bngc\b'
  ebay_lot_query: "gamecube game lot"

- id: wii
  name: Nintendo Wii
  match: '\b(nintendo )?wii\b'
  ebay_lot_query: "wii game lot"

- id: wii-u
  name: Nintendo Wii U
  match: '\b(nintendo )?wii ?u\b'
  ebay_lot_query: "wii u game lot"

- id: switch
  name: Nintendo Switch
  match: '\b(nintendo )?switch( lite| oled( model)?)?\b'
  ebay_lot_query: "nintendo switch game lot"

- id: switch-2
  name: Nintendo Switch 2
  match: '\b(nintendo )?switch 2\b'
  ebay_lot_query: "nintendo switch 2 game lot"

- id: gameboy
  name: Game Boy
  match: '\b(nintendo )?game ?boy\b'
  ebay_lot_query: "game boy game lot"

- id: gameboy-color
  name: Game Boy Color
  match: '\b(nintendo )?game ?boy colou?r\b|\bgbc\b'
