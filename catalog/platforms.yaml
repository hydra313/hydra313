- id: game-gear
  name: Sega Game Gear
  match: '\b(sega )?game ?gear\b'
  ebay_lot_query: "game gear game lot"

- id: ps1
  name: PlayStation
  match: '\b(ps1|psx|psone|ps one|playstation( 1| one)?)\b(?! ?([2-5]|vita|portable|portal|classic|vr|move|plus|network)\b)'
