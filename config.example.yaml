# Copy to config.yaml in the folder you run `python -m dealfinder` from.
# Every value below is the built-in default; delete what you don't change.
# Unknown keys are rejected at startup so typos show up.
# Secrets (API keys, webhook URL) are NOT read from this file: use environment variables.

# --- storage / scheduling ---
db_path: dealfinder.db          # SQLite file, created in the folder you run from
catalog_dir: catalog            # seed catalog folder (YAML files)
refresh_minutes: 2              # continuous checks while the app runs; overlapping runs are skipped
ebay_full_pass_hours: 3         # how often eBay gets a full (not incremental) search pass

# --- scoring ---
sell_fee_rate: 0.1325           # fraction of the resale price lost to eBay fees
sell_shipping:                  # what you expect to pay to ship a resold item, per category
  gpu: 20
  cpu: 8
  console: 30
  controller: 10
buy_shipping_estimate:          # assumed inbound shipping when a listing doesn't say, per category
  gpu: 20
  cpu: 8
  console: 30
  controller: 10
lot_ship_base: 8                # game lots: base shipping estimate (USD)
lot_ship_per_game: 0.40         # game lots: extra shipping per game (USD)
min_profit: 30                  # single items: minimum expected profit (USD)
min_lot_profit: 50              # lots: minimum expected profit (USD)
min_discount: 0.20              # minimum discount versus market value (0.20 = 20%)
min_hardware_lot: 3             # smallest for-parts hardware lot worth considering (units)
min_game_lot: 5                 # smallest game lot worth considering (games)
rare_item_threshold: 50         # photo scans: an identified item worth at least this (USD) counts as a rare find
tax_rate: 0                     # sales tax added to your cost (0.07 = 7%)
market_ttl_hours: 24            # how long a market value is cached
item_price_ttl_days: 30         # how long a photo-identified item's price is cached
min_comps: 5                    # sold comps needed to trust a market value
min_item_comps: 3               # sold comps needed to price a photo-identified item
repair_defaults:                # for-parts lots: [repair cost per unit in USD, repair success rate]
  console: [25, 0.60]
  controller: [8, 0.70]
  gpu: [40, 0.40]
  cpu: [10, 0.30]

# --- per-source fees ---
buyer_premium_pct:              # buyer's premium added to the bid, as a fraction
  ebay: 0.0
  shopgoodwill: 0.0
  hibid: 0.15
handling_fee:                   # flat handling fee added per order (USD)
  ebay: 0.0
  shopgoodwill: 5.0
  hibid: 0.0

# --- search ---
hibid_mode: browser             # browser page import; api = legacy adapter; off = disable
hibid_snapshot_minutes: 30      # imported prices expire; integer 1-120 minutes
