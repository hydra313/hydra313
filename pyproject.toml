[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consolehawk"
version = "0.1.0"
description = "ConsoleHawk hunts collectible consoles and hardware deals across auction sites"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "httpx",
    "selectolax",
    "pyyaml",
    "apscheduler>=3,<4",
    "pillow",
    "anthropic>=2.1",
    "tzdata",
    "playwright>=1.55,<2",
]

[project.optional-dependencies]
dev = ["pytest", "respx"]

[tool.setuptools.packages.find]
include = ["dealfinder*"]

[tool.setuptools.package-data]
"dealfinder" = ["collector_capture.js"]
"dealfinder.web" = ["templates/*.html", "templates/partials/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
