<div id="header-controls" class="controls">
  <div class="control-bar">
  <div class="row scanning-control">
    <form hx-post="/controls/scan" hx-target="#header-controls" hx-swap="outerHTML">
      <input type="hidden" name="on" value="{{ 'false' if scan_enabled else 'true' }}">
      <button type="submit" class="switch{% if scan_enabled %} on{% endif %}" role="switch"
              aria-checked="{{ 'true' if scan_enabled else 'false' }}">Photo scanning: {{ 'on' if scan_enabled else 'off' }}</button>
    </form>
    <span class="spend">Today <strong>{{ spent_today|money }}</strong><span class="spend-divider">/</span>Month <strong>{{ spent_month|money }}</strong></span>
  </div>
  <details class="scan-settings"{% if caps_error %} open{% endif %}>
  <summary>Scan budgets <span aria-hidden="true">⌄</span></summary>
  <form class="row caps" hx-post="/controls/caps" hx-target="#header-controls" hx-swap="outerHTML">
    <label>Daily cap $<input type="number" name="daily" min="0" step="0.01" value="{{ '%.2f'|format(caps.daily) }}"></label>
    <label>Monthly cap $<input type="number" name="monthly" min="0" step="0.01" value="{{ '%.2f'|format(caps.monthly) }}"></label>
    <label>Max scan price $<input type="number" name="max_scan_price" min="0" step="0.01" value="{{ '%.2f'|format(caps.max_scan_price) }}"></label>
    <button type="submit">Save caps</button>
    {% if caps_error %}<p class="error" role="alert">{{ caps_error }}</p>{% endif %}
  </form>
  </details>
  <div class="row refresh-controls">
    <form hx-post="/controls/pause" hx-target="#header-controls" hx-swap="outerHTML">
      <input type="hidden" name="on" value="{{ 'false' if paused else 'true' }}">
      <span class="scheduler{% if paused %} paused{% endif %}">Scheduler: {{ 'paused' if paused else 'running' }}</span>
      <button type="submit">{{ 'Resume' if paused else 'Pause' }}</button>
    </form>
    <button class="primary" type="button" hx-post="/refresh" hx-target="#header-status" hx-swap="outerHTML"><span aria-hidden="true">↻</span> Refresh now</button>
  </div>
  </div>
  {% include "partials/header_status.html" %}
</div>
