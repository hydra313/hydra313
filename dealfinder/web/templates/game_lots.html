{% extends "base.html" %}
{% block title %}Game lots · dealfinder{% endblock %}
{% block content %}
<h1>Game lots</h1>
<form class="filters" hx-get="/lots/games" hx-target="#lot-rows" hx-trigger="change, submit" hx-push-url="true">
  <label>Platform
    <select name="platform">
      <option value="">All</option>
      {% for id, name in platforms.items() %}
      <option value="{{ id }}"{% if filters.platform == id %} selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Ending within
    <input type="number" name="ending_within_h" min="0" step="1" inputmode="numeric"
           value="{{ '%g'|format(filters.ending_within_h) if filters.ending_within_h is not none else '' }}"> h
  </label>
  <label class="check"><input type="checkbox" name="photo_finds_only" value="1"{% if filters.photo_finds_only %} checked{% endif %}> 💎 Photo finds only</label>
</form>
<table class="deals">
  <thead>
    <tr>
      <th><span class="sr-only">Image</span></th><th>Title</th><th>Platform</th><th>Games</th>
      <th>Cost per game</th><th>Market per game</th><th>Expected profit</th><th>Discount</th>
      <th>Site</th><th>Time left</th><th><span class="sr-only">Actions</span></th>
    </tr>
  </thead>
  <tbody id="lot-rows">
    {% include "partials/game_rows.html" %}
  </tbody>
</table>
{% endblock %}
